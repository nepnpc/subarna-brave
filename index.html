<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subarna — Coming Soon</title>
  <meta name="description" content="subarna.brave — something new is on the way.">
  <style>
    :root { --bg:#0b0b10; --fg:#f4f4f6; --muted:#9a9aa8; --accent:#fb542b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      min-height:100vh; display:grid; place-items:center; padding:24px;
      background:radial-gradient(circle at 50% 30%, #1d1420 0%, var(--bg) 60%);
      color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; text-align:center;
    }
    .tag { color:var(--accent); letter-spacing:.3em; font-size:.8rem; text-transform:uppercase; }
    h1 { font-size:clamp(2.5rem,9vw,5.5rem); line-height:1; margin:.4em 0; font-weight:800; }
    p { color:var(--muted); max-width:32rem; margin:0 auto; line-height:1.6; }
    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--accent);
      margin-right:8px; animation:pulse 1.6s infinite; }
    @keyframes pulse { 50% { opacity:.25; } }
    footer { margin-top:3rem; font-size:.8rem; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="tag"><span class="dot"></span>subarna.brave</div>
    <h1>Coming Soon</h1>
    <p>Something new is being built here. Check back soon.</p>
    <footer>&copy; 2026 Subarna</footer>
  </main>
</body>
</html>
